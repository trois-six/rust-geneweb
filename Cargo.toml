[package]
name = "geneweb"
version = "0.4.0"
edition = "2021"
# Dictated by oxidged, whose own rust-version is 1.88.
rust-version = "1.88"
authors = ["Pierre Erraud <trois.six+github@ik.me>"]
description = "A parser for GeneWeb .gw genealogy files, with conversion to GEDCOM via oxidged"
keywords = ["genealogy", "geneweb", "gedcom", "parser", "family-trees"]
categories = ["parser-implementations", "data-structures"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/trois-six/rust-geneweb"
documentation = "https://docs.rs/geneweb"
# `examples` ships because the README tells readers to run `cargo run --example gw2ged`,
# which only works if the example is in the package. `tests` and their fixtures ship so
# that `cargo test` works from a crates.io download; the two `.gw` fixtures come from
# GeneWeb's own test suite and are what backs the correctness claims in the README.
include = [
    "Cargo.toml",
    "src/**/*.rs",
    "examples/**/*.rs",
    "tests/**/*.rs",
    "tests/fixtures/*.gw",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[dependencies]
# oxidged (a conformant, lenient GEDCOM reader and writer) is not on crates.io yet: its main
# branch stands in for 0.1.0 until then. Publishing strips the git source and keeps the
# version requirement.
oxidged = { version = "0.1.0", git = "https://github.com/trois-six/oxidged", branch = "main" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
